<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://princecollections-api.teamquinoto.workers.dev http://localhost:8787 http://127.0.0.1:8787; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<meta name="robots" content="noindex">
<title>Stock catalog</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/catalogo-tema.js"></script>
<style>
/* ============================================================
   Catálogo público — mismos tokens que la app (styles.css)
   ============================================================ */
:root{
  --paper:#faf9f7; --surface:#fff; --surface-2:#f5f3ef;
  --line:#eae7e1; --line-strong:#dad6ce;
  --text:#1a1a1a; --muted:#6b665e;
  --accent:#2563eb; --accent-ink:#2563eb; --up-bg:#eaf0fc;
  --pos:#15803d; --pos-bg:#e8f3ec;
  --warn-ink:#b45309; --warn-bg:#fcf1e1;
  --radius:16px;
  /* v100 · mismas escalas que la app (styles.css) */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-base:15px; --fs-lg:16px; --fs-xl:18px; --fs-2xl:22px;
  --accent-fill:#2563eb; --shadow-2:0 12px 32px rgba(17,19,23,.16),0 2px 6px rgba(17,19,23,.08);
  --wa:#0f7a3d;
  --input-border:#8a8478;   /* 3.7:1: se ve dónde escribir (WCAG 1.4.11) */   /* verde WhatsApp legible: 5.4:1 (antes #128c4a = 4.3:1) */
  --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --topbar-bg:#fff;
  --scrim:rgba(20,18,15,.38);
}
:root[data-theme="dark"]{
  --paper:#0f141b; --surface:#161c25; --surface-2:#1d2530;
  --line:#28303c; --line-strong:#38424f;
  --text:#e6e9ee; --muted:#8b93a1;
  --accent:#4d82e8; --accent-ink:#7aa5f0; --up-bg:#17243b;
  --pos:#4ade80; --pos-bg:#16301f;
  --warn-ink:#fbbf24; --warn-bg:#3a2e14;
  --topbar-bg:#12171f;
  --accent-fill:#2f6bdc;   /* blanco encima = 4.9:1 (antes #4d82e8 = 3.7:1) */
  --shadow-2:0 16px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
  --wa:#4ade80;
  --input-border:#6b7686;
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--text);font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
small{font-size:max(12px,.8em)}   /* v100: nada por debajo de 12px */

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;align-items:center;gap:12px}
.tb-mark{width:30px;height:30px;border-radius:var(--r-sm);background:var(--text);color:var(--paper);display:grid;place-items:center;flex:none}
.tb-mark svg{width:17px;height:17px}
.tb-name{font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:var(--r-pill);padding:0 14px;min-height:40px;font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--paper)}
.icon-btn{width:44px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:17px;height:17px}

/* ---------- encabezado ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(28px,4.6vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.live{display:inline-flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 4px var(--pos-bg)}

/* ---------- filtros ---------- */
.filters{position:sticky;top:calc(55px + env(safe-area-inset-top,0px));z-index:20;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--input-border);border-radius:var(--r-md);padding:0 12px;height:44px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-pill);padding:6px 14px;min-height:40px;font-size:var(--fs-md);font-weight:600;display:flex;gap:7px;align-items:center}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--text);color:var(--paper);border-color:var(--text)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip .dot{width:9px;height:9px;border-radius:50%}

/* ---------- grilla por juego ---------- */
.group{margin-top:28px}
.group h2{font-size:var(--fs-xl);letter-spacing:-.02em;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.group h2 small{font-size:var(--fs-md);color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:700px){ .filters{position:static} }
@media (max-width:520px){ .grid{grid-template-columns:1fr 1fr;gap:10px} .wrap{padding:0 14px} .topbar{padding-left:14px;padding-right:14px} }

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.tile.in-cart{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.media{aspect-ratio:5/4;position:relative;background:var(--surface-2);overflow:hidden}
.media img{width:100%;height:100%;object-fit:contain;display:block;padding:10px}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;color:var(--ph-fg);background:var(--ph-bg)}
.ph svg{position:absolute;right:-18px;top:-10px;width:78%;height:auto;opacity:.22}
.ph span{position:relative;font-weight:800;font-size:clamp(26px,3.4vw,36px);line-height:1;letter-spacing:-.03em;max-width:85%;overflow-wrap:anywhere}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:var(--fs-xs);font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--surface);color:var(--text);border:1px solid var(--line-strong)}
.badge.soon{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-weight:600;font-size:var(--fs-md);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.9em}
.stock{font-size:var(--fs-md);color:var(--muted);display:flex;flex-direction:column;gap:1px}
.stock b{color:var(--text);font-weight:700}
.stock .tr{color:var(--warn-ink)}
.stock .lim{font-size:var(--fs-xs);color:var(--muted);font-weight:600}
/* v92: en tránsito → foto apagada + franja cruzada */
.media.is-soon img,.media.is-soon .ph{filter:grayscale(.9) opacity(.45)}
.ribbon{position:absolute;left:-25%;right:-25%;top:50%;transform:translateY(-50%) rotate(-14deg);
  background:#f59e0b;color:#1a1a1a;text-align:center;font-weight:800;font-size:clamp(13px,1.6vw,16px);letter-spacing:.14em;text-transform:uppercase;
  padding:8px 0;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.tile.soon .name{opacity:.75}
.add:disabled{opacity:.6;cursor:not-allowed;border-style:dashed}
.stepper button:disabled,.mini-step button:disabled{opacity:.35;cursor:not-allowed}
.stock small{font-size:var(--fs-xs)}
.add{margin-top:auto;height:38px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:var(--fs-md)}
.add:hover{border-color:var(--text)}
.stepper{margin-top:auto;height:44px;display:grid;grid-template-columns:44px 1fr 44px;border-radius:var(--r-md);background:var(--up-bg);color:var(--accent-ink);overflow:hidden}
.stepper button{border:0;background:transparent;font-size:var(--fs-xl);font-weight:600;color:inherit}
.stepper input{border:0;background:transparent;text-align:center;font-weight:700;width:100%;min-width:0;outline:0;color:inherit}
.unit-hint{font-size:var(--fs-xs);color:var(--muted);text-align:center;margin-top:-3px}
.over{font-size:var(--fs-xs);color:var(--warn-ink)}

.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:var(--fs-xl);margin-bottom:4px}
.skel{height:340px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- barra de pedido (abajo) ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  pointer-events:none;display:flex;justify-content:center}
.cartbar button{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--paper);border:0;border-radius:var(--r-pill);
  padding:12px 14px 12px 20px;font-weight:600;font-size:var(--fs-base);box-shadow:0 10px 30px rgba(0,0,0,.18);transform:translateY(0);transition:transform .2s}
.cartbar button[hidden]{display:none}
.cartbar .count{background:var(--accent);color:#fff;border-radius:var(--r-pill);padding:1px 10px;font-weight:700}

/* ---------- panel del pedido ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;background:var(--surface);display:flex;flex-direction:column;transition:transform .25s ease;
  right:0;top:0;bottom:0;width:min(440px,100%);transform:translateX(100%);border-left:1px solid var(--line)}
.sheet.open{transform:none}
@media (max-width:640px){
  .sheet{left:0;right:0;top:auto;width:100%;max-height:88vh;border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(100%);border-left:0}
}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:var(--fs-xl);letter-spacing:-.01em}
.sh-head .icon-btn{margin-left:auto}
.sh-body{overflow:auto;padding:6px 18px 12px;flex:1}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .ln{font-weight:600;font-size:var(--fs-md);line-height:1.3}
.line .lg{font-size:var(--fs-sm);color:var(--muted)}
.line .ctrl{display:flex;align-items:center;gap:6px;grid-column:1/3}
.mini-step{display:inline-grid;grid-template-columns:40px 48px 40px;height:40px;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.mini-step button{border:0;background:var(--surface-2);font-weight:600}
.mini-step input{border:0;text-align:center;font-weight:700;background:var(--surface);min-width:0;outline:0}
.seg.sm button{padding:3px 9px;font-size:var(--fs-sm)}
.rm{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:var(--fs-sm);text-decoration:underline;text-underline-offset:2px}
.field{margin-top:14px}
.field label{display:block;font-size:var(--fs-sm);font-weight:600;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:9px 11px;outline:0}
.field textarea{min-height:64px;resize:vertical}
.preview{margin-top:14px;background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;font-size:var(--fs-sm);white-space:pre-wrap;color:var(--muted);max-height:170px;overflow:auto}
.sh-foot{border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px}
.sh-foot p{margin:0 0 2px;font-size:var(--fs-md);color:var(--muted)}
.btn{height:46px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn.wa{color:var(--wa)}
.clear{align-self:center;border:0;background:transparent;color:var(--muted);font-size:var(--fs-sm);text-decoration:underline;text-underline-offset:2px;padding:0 12px;min-height:44px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--paper);
  padding:10px 16px;border-radius:var(--r-md);font-size:var(--fs-md);font-weight:600;opacity:0;transition:all .2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin:48px 0 20px;color:var(--muted);font-size:var(--fs-sm)}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header class="topbar">
  <span class="tb-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></span>
  <span class="tb-name" id="tbName">Stock catalog</span>
  <div class="tb-right">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="heroTitle">Available stock</h1>
    <p><span class="live"><i aria-hidden="true"></i><span id="heroSub">Loading…</span></span></p>
  </section>

  <div class="filters">
    <div class="frow">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search products">
      </label>
      <div class="seg" role="group" id="viewSeg">
        <button type="button" data-view="units">Units</button><button type="button" data-view="cases">Cases</button>
      </div>
    </div>
    <div class="chips" id="chips" role="group"></div>
  </div>

  <div id="list" aria-live="polite"></div>
  <footer id="foot"></footer>
</main>

<div class="cartbar"><button type="button" id="cartBtn" hidden><span id="cartBtnTxt">Review order</span><span class="count num" id="cartCount">0</span></button></div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" aria-hidden="true">
  <div class="sh-head">
    <h3 id="shTitle">Your order</h3>
    <button class="icon-btn" id="shClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot" id="shFoot">
    <p id="ctaHint">Copy this and send it to your seller.</p>
    <button class="btn primary" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="copyTxt">Copy order</span>
    </button>
    <div class="btn-row">
      <button class="btn wa" id="waBtn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>
        WhatsApp
      </button>
      <button class="btn" id="mailBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <span id="mailTxt">Email</span>
      </button>
    </div>
    <button class="clear" id="clearBtn" type="button">Clear order</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script src="js/catalogo.js"></script>
</body>
</html>
